# RAPS · DGRAMET v5.0 — Configuración nginx
# Incluir dentro del bloque server{} o en conf.d/raps.conf

    root /var/www/raps;
    index index.html;

    # ── Cabeceras de seguridad ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "\
        default-src 'self'; \
        script-src 'self'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data:; \
        font-src 'self'; \
        connect-src 'none'; \
        object-src 'none'; \
        base-uri 'self'; \
        form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── SPA: todas las rutas → index.html ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Activos vendor: caché larga ───────────────────────────────────────
    location /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Activos JS/CSS propios: caché media ───────────────────────────────
    location ~* \.(js|css)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── HTML: sin caché ───────────────────────────────────────────────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Denegar ficheros sensibles ────────────────────────────────────────
    location ~* (\.htaccess|\.py|_monolito\.html)$ {
        deny all;
    }

    # ── Codificación ──────────────────────────────────────────────────────
    charset utf-8;
    server_tokens off;
